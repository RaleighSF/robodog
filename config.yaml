detection:
  alert_logging: true
  detection_cooldown: 2.0
  log_detections: true
  save_images: false
  save_thumbnails: false
go2:
  enabled: true
  # Robot host is resolved at runtime by probing these in order (robot_host.py).
  # service_url below is a legacy default kept for tools that still read it.
  host_candidates:
  - 192.168.50.207   # Cradlepoint 'Smart Robotics Lan' (static)
  - 10.0.0.57        # home 'SmartRoboticsLan' (DHCP)
  - 192.168.193.111  # ZeroTier (network-independent fallback)
  robot_ip: 192.168.123.161
  service_url: http://10.0.0.57:5001
rtsp:
  buffer_size: 1
  max_reconnect_attempts: 10
  reconnect_interval: 5
  timeout: 30000
scene_narrator:
  default_mode: casual
  enabled: true
  gesture:
    cooldown_seconds: 3
  model: qwen2.5vl:3b
  ollama_url: http://127.0.0.1:11434
  scene_context: 'You are on the show floor of a technology conference. This is background
    about the venue, not a description of what you see: mention people, booths, badges,
    phones or crowds only when they are actually in view.

    People often stop, crouch to your level, film you or wave. When that is really
    happening, comment on it. When the aisle is quiet, say so.

    Be dry about the attention you get, or the lack of it, and never smug.'
telemetry:
  backend: s3
  deployment_id: watchdog-demo
  device_id: watchdog-edge-01
  device_type: nvidia_agx_orin
  enabled: true
  flush_interval_seconds: 10
  heartbeat_interval_seconds: 30
  image_max_width: 960
  local_export_dir: telemetry_export
  max_buffer_size: 100
  s3_bucket: watchdog-telemetry
  s3_endpoint_url: null
  s3_prefix: v1
  s3_region: us-east-1
  thumbnail_max_width: 320
  upload_images: true
ui:
  # First-boot demo skin (default | azure | aws). The live choice is made in
  # the dashboard (Configure > Demo profile) and persisted to ui_state.json.
  profile: default
  # Pin one skin for an event and hide the picker, e.g. `lock_profile: aws`
  # at re:Invent (sponsor rules: no competitor clouds on screen). Empty = off.
  lock_profile: ''
  nvidia_badge:
    enabled: true
    # Leave empty to derive from telemetry.device_type (e.g. Jetson AGX Orin).
    platform: ''
vision:
  classes:
  - person
  conf: 0.25
  detection_mode: text
  detector: yoloe
  device: auto
  engine_path: ''
  imgsz: 1280
  iou: 0.45
  max_det: 100
  model_path: yolo11m.pt
  nlp_enabled: false
  nlp_prompt: Find all electronics
  openai_api_key: ''
  rtsp_tcp: true
  source: rtsp://10.0.0.57:8554/color
  visual_prompts: []
