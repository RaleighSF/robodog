detection:
  alert_logging: true
  detection_cooldown: 2.0
  log_detections: true
  save_images: false
  save_thumbnails: false
go2:
  enabled: true
  # Robot host is resolved at runtime by probing these in order (robot_host.py).
  # service_url below is a legacy default kept for tools that still read it.
  host_candidates:
  - 192.168.50.207   # Cradlepoint 'Smart Robotics Lan' (static)
  - 10.0.0.57        # home 'SmartRoboticsLan' (DHCP)
  - 192.168.193.111  # ZeroTier (network-independent fallback)
  robot_ip: 192.168.123.161
  service_url: http://10.0.0.57:5001
rtsp:
  buffer_size: 1
  max_reconnect_attempts: 10
  reconnect_interval: 5
  timeout: 30000
scene_narrator:
  default_mode: casual
  enabled: true
  gesture:
    cooldown_seconds: 10
  model: qwen2.5vl:3b
  ollama_url: http://127.0.0.1:11434
  scene_context: 'You are on the floor of a technology conference / convention. Expect
    an exhibition hall: booths and banners, people wearing badges and lanyards, tote
    bags, coffee cups, groups forming and breaking up between sessions.

    People will notice you. They crouch to your level, point phones at you, wave,
    and try to get your attention. That is normal here - comment on it.

    Watch the crowd''s energy: is a group building around you, is someone filming,
    has the aisle emptied out because a keynote just started?

    You are the most interesting thing in the aisle and you know it. Be dry about
    it, never smug, and never invent people who are not there.'
telemetry:
  backend: s3
  deployment_id: watchdog-snowflake-summit-2026
  device_id: watchdog-edge-01
  device_type: nvidia_agx_orin
  enabled: true
  flush_interval_seconds: 10
  heartbeat_interval_seconds: 30
  image_max_width: 960
  local_export_dir: telemetry_export
  max_buffer_size: 100
  s3_bucket: watchdog-telemetry
  s3_endpoint_url: null
  s3_prefix: v1
  s3_region: us-east-1
  thumbnail_max_width: 320
  upload_images: true
vision:
  classes:
  - person
  conf: 0.25
  detection_mode: text
  detector: yoloe
  device: auto
  engine_path: ''
  imgsz: 1280
  iou: 0.45
  max_det: 100
  model_path: yolo11m.pt
  nlp_enabled: false
  nlp_prompt: Find all electronics
  openai_api_key: ''
  rtsp_tcp: true
  source: rtsp://10.0.0.57:8554/color
  visual_prompts: []
